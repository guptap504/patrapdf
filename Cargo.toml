[package]
name = "patrapdf"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
description = "Fill in, sign, redact and watermark PDFs on your own computer."
authors = ["Prashant Gupta <6059565+guptap504@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/guptap504/patrapdf"
readme = "README.md"
keywords = ["pdf", "signature", "forms", "redaction", "gpui"]
categories = ["gui", "text-processing"]

[dependencies]
gpui = "0.2.2"
hayro = "0.9.0"
lopdf = "0.47.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
anyhow = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
futures = { version = "0.3", default-features = false, features = ["std"] }
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier"] }
semver = "1"
sha2 = "0.11"
minisign-verify = "0.3"
self-replace = "1.5"
zip = { version = "9.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
fontdb = "0.23"
rustybuzz = "0.20"
subsetter = "0.2.6"
unicode-bidi = "0.3"
getrandom = "0.3"

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }

# Trackpad pinch-to-zoom: GPUI already uses objc 0.2, so this adds no new crate.
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7"

# Windows: icon and version info in the .exe (see build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.20"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# ---------------------------------------------------------------------------
# Linux packages. Build with `cargo build --release` first, then
# `cargo deb --no-build` / `cargo generate-rpm` (see .github/workflows/release.yml).
# ---------------------------------------------------------------------------

[package.metadata.deb]
name = "patrapdf"
maintainer = "Prashant Gupta <6059565+guptap504@users.noreply.github.com>"
copyright = "2026, Prashant Gupta"
section = "graphics"
priority = "optional"
extended-description = """\
PatraPDF fills in and signs PDF forms entirely offline: type text, add dates \
and checkmarks, place signature images, black out (truly remove) sensitive \
content, stamp a watermark, and delete, reorder or add pages."""
depends = "$auto"
# Fonts metrically matching the PDF's Helvetica; GPU drivers for the Vulkan
# renderer; the desktop portal for Open/Save dialogs.
recommends = "fonts-liberation, mesa-vulkan-drivers, libvulkan1, xdg-desktop-portal"
assets = [
    ["target/release/patrapdf", "usr/bin/", "755"],
    ["packaging/linux/io.github.guptap504.PatraPDF.desktop", "usr/share/applications/", "644"],
    ["packaging/linux/io.github.guptap504.PatraPDF.metainfo.xml", "usr/share/metainfo/", "644"],
    ["packaging/linux/icons/16.png", "usr/share/icons/hicolor/16x16/apps/io.github.guptap504.PatraPDF.png", "644"],
    ["packaging/linux/icons/24.png", "usr/share/icons/hicolor/24x24/apps/io.github.guptap504.PatraPDF.png", "644"],
    ["packaging/linux/icons/32.png", "usr/share/icons/hicolor/32x32/apps/io.github.guptap504.PatraPDF.png", "644"],
    ["packaging/linux/icons/48.png", "usr/share/icons/hicolor/48x48/apps/io.github.guptap504.PatraPDF.png", "644"],
    ["packaging/linux/icons/64.png", "usr/share/icons/hicolor/64x64/apps/io.github.guptap504.PatraPDF.png", "644"],
    ["packaging/linux/icons/128.png", "usr/share/icons/hicolor/128x128/apps/io.github.guptap504.PatraPDF.png", "644"],
    ["packaging/linux/icons/256.png", "usr/share/icons/hicolor/256x256/apps/io.github.guptap504.PatraPDF.png", "644"],
    ["packaging/linux/icons/512.png", "usr/share/icons/hicolor/512x512/apps/io.github.guptap504.PatraPDF.png", "644"],
    ["README.md", "usr/share/doc/patrapdf/README.md", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/patrapdf", dest = "/usr/bin/patrapdf", mode = "755" },
    { source = "packaging/linux/io.github.guptap504.PatraPDF.desktop", dest = "/usr/share/applications/io.github.guptap504.PatraPDF.desktop", mode = "644" },
    { source = "packaging/linux/io.github.guptap504.PatraPDF.metainfo.xml", dest = "/usr/share/metainfo/io.github.guptap504.PatraPDF.metainfo.xml", mode = "644" },
    { source = "packaging/linux/icons/16.png", dest = "/usr/share/icons/hicolor/16x16/apps/io.github.guptap504.PatraPDF.png", mode = "644" },
    { source = "packaging/linux/icons/24.png", dest = "/usr/share/icons/hicolor/24x24/apps/io.github.guptap504.PatraPDF.png", mode = "644" },
    { source = "packaging/linux/icons/32.png", dest = "/usr/share/icons/hicolor/32x32/apps/io.github.guptap504.PatraPDF.png", mode = "644" },
    { source = "packaging/linux/icons/48.png", dest = "/usr/share/icons/hicolor/48x48/apps/io.github.guptap504.PatraPDF.png", mode = "644" },
    { source = "packaging/linux/icons/64.png", dest = "/usr/share/icons/hicolor/64x64/apps/io.github.guptap504.PatraPDF.png", mode = "644" },
    { source = "packaging/linux/icons/128.png", dest = "/usr/share/icons/hicolor/128x128/apps/io.github.guptap504.PatraPDF.png", mode = "644" },
    { source = "packaging/linux/icons/256.png", dest = "/usr/share/icons/hicolor/256x256/apps/io.github.guptap504.PatraPDF.png", mode = "644" },
    { source = "packaging/linux/icons/512.png", dest = "/usr/share/icons/hicolor/512x512/apps/io.github.guptap504.PatraPDF.png", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/patrapdf/README.md", mode = "644", doc = true },
]

[package.metadata.generate-rpm.recommends]
liberation-sans-fonts = "*"
vulkan-loader = "*"
xdg-desktop-portal = "*"
