name: Release

# Push a tag like v0.1.0 to build every package and publish a GitHub release.
# Run it by hand (Actions → Release → Run workflow) to build the packages
# without publishing; they're attached to the run as artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"
            exit 1
          fi

  macos:
    name: macOS (${{ matrix.arch }})
    needs: version
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x86_64
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.15.7"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: packaging/macos/bundle.sh ${{ matrix.target }} dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows (x64)
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist, staging | Out-Null
          Copy-Item target/release/pdf-signer.exe, README.md staging/
          Copy-Item LICENSE staging/LICENSE.txt
          Compress-Archive -Path staging/* -DestinationPath "dist/PDF-Signer-$env:VERSION-windows-x64-portable.zip"
      - name: Installer
        run: |
          if ! command -v iscc >/dev/null && [ ! -x "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then
            choco install innosetup --no-progress -y
          fi
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          command -v iscc >/dev/null && iscc=iscc
          "$iscc" //DAppVersion="$VERSION" packaging/windows/installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux (x86_64)
    needs: version
    # The oldest supported runner, so the binaries work on older glibc too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: packaging/linux/install-build-deps.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - run: cargo build --release --locked
      - name: .deb
        run: cargo deb --no-build --no-strip --output dist/
      - name: .rpm
        run: cargo generate-rpm --output dist/
      - name: AppImage
        run: packaging/linux/appimage.sh dist
      - name: Check the packages
        run: |
          ls -la dist
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
          rpm -qpil dist/*.rpm
          rpm -qpR dist/*.rpm
          desktop-file-validate packaging/linux/io.github.guptap504.PdfSigner.desktop
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "PDF Signer ${{ needs.version.outputs.version }}" \
            --generate-notes
