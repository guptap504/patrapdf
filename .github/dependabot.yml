version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      cargo:
        update-types: [minor, patch]
    ignore:
      # libc 0.2.190 dropped ENOATTR on Linux, which GPUI's xattr 0.2 needs.
      - dependency-name: libc
        versions: [">0.2.189"]
